sonar.projectKey=dengar-rakyat-testing
sonar.projectName=dengar-rakyat-testing
sonar.host.url=http://localhost:9000
sonar.projectBaseDir=.

# cuma folder ini yang discan
sonar.sources=app,components,db,features,hooks,lib

# exclude di level mana pun
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,public/**,scripts/**,webgoat/**,testing/**

# Abaikan perhitungan coverage agar Quality Gate tidak failed jika belum ada unit test
sonar.coverage.exclusions=**/*
